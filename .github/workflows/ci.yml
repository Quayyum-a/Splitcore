name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: splitcore
          POSTGRES_PASSWORD: splitcore
          POSTGRES_DB: splitcore_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U splitcore"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://splitcore:splitcore@localhost:5432/splitcore_test?schema=public
      REDIS_HOST: localhost
      REDIS_PORT: 6379
      JWT_SECRET: ci-only-secret-not-for-production-use
      JWT_EXPIRES_IN: 1d
      LOG_LEVEL: warn
      # Not real credentials — the E2E suite signs its own webhook payloads
      # with this, and webhook verification rejects an empty secret outright.
      PAYSTACK_SECRET_KEY: sk_test_ci_only_not_a_real_key
      PAYSTACK_PUBLIC_KEY: pk_test_ci_only_not_a_real_key

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      # lint:check, not lint: `npm run lint` passes --fix, which rewrites the
      # files and exits 0, so it can never fail the build.
      - name: Lint
        run: npm run lint:check

      - name: Build
        run: npm run build

      - name: Run database migrations
        run: npx prisma migrate deploy

      # --coverage, or the thresholds in jest.config.js never execute and the
      # 80% gate is declared but unenforced.
      - name: Unit tests
        run: npm test -- --ci --coverage

      # --runInBand lives in the test:e2e script, not here, so a local run
      # behaves the same way. The E2E suites share one Postgres and each resets
      # it, so parallel workers truncate the database out from under each other.
      - name: E2E tests
        run: npm run test:e2e -- --ci
