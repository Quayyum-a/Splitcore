services:
  # API Web Service
  - type: web
    name: splitcore-api
    runtime: node
    region: oregon
    plan: starter
    buildCommand: npm ci --include=dev && npx prisma generate && npm run build
    startCommand: npm run start:prod
    healthCheckPath: /health
    autoDeploy: true
    branch: main
    
    envVars:
      # Pin the runtime. Render otherwise tracks latest (Node 24), which has
      # no prebuilt @sentry/profiling-node binaries and is not what CI tests.
      - key: NODE_VERSION
        value: 22
      
      - key: NODE_ENV
        value: production
      
      - key: PORT
        value: 3000
      
      - key: DATABASE_URL
        sync: false
        # Set in Render dashboard. Use Supabase's connection POOLER, not the
        # direct db.PROJECT_REF.supabase.co host — that host resolves to IPv6
        # only, so anything without IPv6 egress cannot reach it:
        # postgresql://postgres.PROJECT_REF:PASSWORD@aws-0-REGION.pooler.supabase.com:5432/postgres?sslmode=require
        # Port 5432 on the pooler is session mode, which `prisma migrate deploy`
        # needs. Port 6543 is transaction mode and additionally requires
        # pgbouncer=true; do not pass pgbouncer=true on port 5432.
      
      # Set to false to run with no Redis at all: no queue, webhooks are
      # processed inline on the request. A stopgap (exhausted provider quota),
      # not a steady state — the worker service cannot run in this mode.
      - key: REDIS_ENABLED
        value: true
      
      - key: REDIS_HOST
        sync: false
        # Set in Render dashboard from Upstash. A bare host or a full
        # rediss:// connection URL both work.
      
      - key: REDIS_PORT
        value: 6379
      
      - key: REDIS_PASSWORD
        sync: false
        # Set in Render dashboard from Upstash
      
      - key: JWT_SECRET
        generateValue: true
        # Auto-generated secure random string (or set manually, min 32 chars)
      
      - key: JWT_EXPIRES_IN
        value: 7d
      
      # Required in production by src/config/validation.schema.ts — the app
      # refuses to boot without them. Set both in the Render dashboard.
      - key: PAYSTACK_SECRET_KEY
        sync: false
        # sk_live_... in production, sk_test_... while still testing
      
      - key: PAYSTACK_PUBLIC_KEY
        sync: false
        # pk_live_... in production, pk_test_... while still testing
      
      - key: APP_URL
        value: https://splitcore-api.onrender.com
      
      # Where Paystack returns the guest after checkout. The redirect proves
      # nothing on its own, so this must land somewhere that re-verifies
      # server-side. Point it at the frontend once that exists.
      - key: PAYMENT_CALLBACK_URL
        value: https://splitcore-api.onrender.com/payments/callback
      
      # Extra browser origins allowed through CORS, comma-separated. The
      # canonical domains and https://splitcore-app.netlify.app are already
      # built into src/config/cors.config.ts; use this for Netlify deploy
      # previews or a custom domain added later.
      - key: ALLOWED_ORIGINS
        sync: false
      
      - key: SENTRY_DSN
        sync: false
        # Set in Render dashboard from Sentry project
      
      - key: SENTRY_TRACES_SAMPLE_RATE
        value: 0.1
      
      - key: LOG_LEVEL
        value: info

  # Queue Worker Service
  - type: worker
    name: splitcore-worker
    runtime: node
    region: oregon
    plan: starter
    buildCommand: npm ci --include=dev && npx prisma generate && npm run build
    startCommand: npm run start:worker:prod
    autoDeploy: true
    branch: main
    
    envVars:
      - key: NODE_VERSION
        value: 22
      
      - key: NODE_ENV
        value: production
      
      - key: DATABASE_URL
        sync: false
        # Must match API service DATABASE_URL (Supabase pooler, port 5432)
      
      - key: REDIS_HOST
        sync: false
        # Must match API service REDIS_HOST
      
      - key: REDIS_PORT
        value: 6379
      
      - key: REDIS_PASSWORD
        sync: false
        # Must match API service REDIS_PASSWORD
      
      - key: JWT_SECRET
        sync: false
        # Must match API service JWT_SECRET
      
      - key: JWT_EXPIRES_IN
        value: 7d
      
      - key: SENTRY_DSN
        sync: false
        # Set in Render dashboard from Sentry project
      
      - key: SENTRY_TRACES_SAMPLE_RATE
        value: 0.1
      
      - key: LOG_LEVEL
        value: info
      
      # The worker initiates payouts and runs reconciliation, both of which
      # call Paystack, so it needs the same credentials as the API.
      - key: PAYSTACK_SECRET_KEY
        sync: false
        # Must match API service PAYSTACK_SECRET_KEY
      
      - key: PAYSTACK_PUBLIC_KEY
        sync: false
        # Must match API service PAYSTACK_PUBLIC_KEY
      
      - key: APP_URL
        value: https://splitcore-api.onrender.com
